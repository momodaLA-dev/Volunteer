<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜跨手機志工測試</title><link rel="stylesheet" href="./sync.css"></head><body><header><h1>暖心同行｜跨手機同步測試</h1><p>志工端 · 不影響原版 v6.2 資料</p></header><main><section class="panel" id="loginBox"><h2>志工登入</h2><label>電子郵件</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="login" style="margin-top:12px;width:100%">登入</button><p class="muted">需由幹部在 Firebase 建立測試帳號。請勿使用真實志工個資。</p></section><div id="app" class="hidden"><div class="panel"><div class="row"><div><strong id="myname"></strong><p class="muted" id="connection"></p></div><button class="secondary" id="logout">登出</button></div><p id="message"></p></div><section class="panel"><h2>我的複點／清點任務</h2><div id="tasks"></div></section><section class="panel hidden" id="work"><h2 id="taskTitle">清點任務</h2><p id="taskInstructions" class="muted"></p><div id="dataList"></div><p class="muted" id="progress"></p><div class="sticky"><div class="actions"><button class="secondary" id="backTasks">返回任務</button><button id="submitTask">整份送審</button></div></div></section><section class="panel"><h2>我的審核狀態</h2><p class="muted">志工只能看到審核狀態；幹部內部備註、比較結果及管理紀錄不會在此顯示。</p><div id="statusList"></div></section></div></main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="./sync.js"></script></body></html>
