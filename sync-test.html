<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜跨手機志工測試</title><link rel="stylesheet" href="./sync.css"></head><body><header><h1>暖心同行｜跨手機同步測試 v7.1</h1><p>志工端 · 雲端指派與審核</p></header><main><nav class="panel quick-links" aria-label="志工功能"><a href="./index.html">通知首頁／原版功能</a><a href="./index.html">今日服務</a><a href="./index.html">物資清點</a><a href="./index.html">品號查詢</a><a href="./index.html">通知聊天</a><a href="./index.html">我的紀錄</a><strong>雲端任務（本頁）</strong></nav><p class="muted">目前原版功能仍存於本機；此頁專門處理跨手機的指派清點及審核狀態。聊天尚未雲端同步。</p><section class="panel" id="loginBox"><h2>志工登入</h2><label>志工代號</label><input id="volCode" type="text" autocomplete="username" autocapitalize="characters" placeholder="例如 V001" maxlength="16" spellcheck="false"><label>個人 PIN（至少 6 碼）</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" placeholder="至少 6 碼"><button id="login" style="margin-top:12px;width:100%">登入</button><p id="loginMessage" role="status" aria-live="polite" style="min-height:24px;margin-top:10px"></p><p class="muted">測試帳號由管理員在 Firebase 建立；不用提供真實 Email。請勿使用真實個資。</p></section><div id="app" class="hidden"><div class="panel"><div class="row"><div><strong id="myname"></strong><p class="muted" id="connection"></p></div><button class="secondary" id="logout">登出</button></div><p id="message"></p></div><section class="panel"><h2>我的複點／清點任務</h2><div id="tasks"></div></section><section class="panel hidden" id="work"><h2 id="taskTitle">清點任務</h2><p id="taskInstructions" class="muted"></p><div id="dataList"></div><p class="muted" id="progress"></p><div class="sticky"><div class="actions"><button class="secondary" id="backTasks">返回任務</button><button id="submitTask">整份送審</button></div></div></section><section class="panel"><h2>我的審核狀態</h2><p class="muted">志工只能看到審核狀態；幹部內部備註、比較結果及管理紀錄不會在此顯示。</p><div id="statusList"></div></section></div></main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="./sync.js?v=20261020-v72"></script><script>window.addEventListener("load",()=>{setTimeout(()=>{const button=document.getElementById("login");const out=document.getElementById("loginMessage");if(button && !button.onclick && out){out.textContent="登入程式未載入。請確認 sync.js 已上傳，並重新整理頁面。";out.style.color="#b42318";}},600);});</script></body></html>
