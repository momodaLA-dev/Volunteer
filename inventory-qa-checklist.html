<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VolunteerCare V2.7｜清點驗收總表</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f2f7f5;color:#143a35;max-width:860px;margin:auto;padding:24px}section{background:white;border:1px solid #cbdcd7;border-radius:14px;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,button{padding:9px;border:1px solid #a4c6bd;border-radius:8px}input[type=checkbox]{transform:scale(1.3);margin-right:12px}button{background:#14695b;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dce7e4;padding:7px;text-align:left}small{color:#57716e}.pass{color:#086c4c}.fail{color:#b32424}pre{white-space:pre-wrap;background:#f4f6f5;padding:12px}</style><h1>♡ 暖心同行｜V2.7 整合驗收</h1><p>本頁是離線驗收清單，不會登入、寫入或讀取 Firebase。先測格式；實際雲端結果請在正式網站操作後手動勾選。</p><section><h2>① 欄位模擬（不連 Firebase）</h2><label>倉別 <select id="w"><option>008倉</option><option>0089倉</option><option>0088倉</option></select></label><label>品號 <input id="s" value="22"></label><label>數量 <input id="q" value="222" inputmode="numeric"></label><label>效期 YYYYMM <input id="e" value="202703" inputmode="numeric"></label><button id="test">檢查最新畫面輸入</button><pre id="res">尚未檢查</pre></section><section><h2>② 正式 Firebase 驗收清單</h2><p><small>每個步驟只有實際按過並在 Firebase 回讀成功後才能勾選，不要將模擬通過視為雲端通過。</small></p><div id="checks"></div><button id="copy">複製驗收結果</button><p id="counter"></p></section><script>const tasks=['V0002 讀取既有 V1 任務（任務號 INV-20261022-5AQ5L）','V0002 輸入多欄位後手動儲存草稿成功','離開再重開：數量、效期仍保留','另一視窗編輯後：偵測版本衝突，沒有覆寫','V0002 正式提交 V1，回讀 submissions 與 statuses 都成功','幹部接收 V1，才能派發 V2','小安 V0001 或其他獲指派志工接收 V2','V2 提交後 V1 結果保持不變','幹部比對 V1／V2 差異結果正確','由幹部派發 V3，第三位志工可收到任務','V3 送審、所有版本保存','整張主單 CSV 含 V1／V2／V3 且數量正確','志工自行發起 V1 → 幹部接收 → 派發 V2 成功','測試重複送審：不得覆蓋第一次提交','手機與電腦各自打開選單正常'];const root=document.getElementById('checks');tasks.forEach((t,i)=>{let l=document.createElement('label');l.innerHTML=`<input type="checkbox" id="t${i}"> ${i+1}. ${t}`;root.append(l)});function report(){let arr=tasks.map((t,i)=>({item:t,passed:document.getElementById('t'+i).checked}));document.getElementById('counter').textContent='已驗收 '+arr.filter(x=>x.passed).length+'/'+arr.length+' 項';return arr}root.addEventListener('change',report);document.getElementById('test').onclick=()=>{let q=document.getElementById('q').value.trim(),e=document.getElementById('e').value.trim(),s=document.getElementById('s').value.trim();let ok=/^\d+$/.test(q)&&Number.isSafeInteger(Number(q))&&/^(19|20|21)\d\d(0[1-9]|1[0-2])$/.test(e)&&/^\d{1,2}$/.test(s);let data={warehouse:document.getElementById('w').value,sku:s.padStart(2,'0'),quantity:q,expiry:e};document.getElementById('res').textContent=(ok?'✅ 欄位格式通過':'❌ 欄位格式不符')+'\n'+JSON.stringify(data,null,2)};document.getElementById('copy').onclick=()=>{const text='VolunteerCare V2.7 驗收\n'+report().map((x,i)=>(x.passed?'[PASS] ':'[TODO] ')+(i+1)+' '+x.item).join('\n');navigator.clipboard?.writeText(text).then(()=>alert('已複製')).catch(()=>{prompt('請複製',text)})};report();</script></html>
