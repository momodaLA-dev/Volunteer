<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜四站雲端接力檢查</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f3f7f5;color:#163c35}*{box-sizing:border-box}body{margin:0;padding:15px}main{max-width:750px;margin:auto}.card{background:#fff;border:1px solid #d3e2db;border-radius:16px;padding:20px;margin:14px 0}h1{font-size:23px}h2{font-size:18px;margin-top:0}.muted{color:#62766e;font-size:14px}label{display:block;font-weight:600;margin:12px 0 6px}input{width:100%;font:inherit;padding:12px;border:1px solid #adc4b9;border-radius:9px}button{font:inherit;cursor:pointer;background:#176b5b;border:0;color:white;padding:12px 14px;border-radius:9px;margin:8px 7px 4px 0}button:disabled{opacity:.4;cursor:not-allowed}.light{background:#e8f2ee;color:#1a5e51}.hide{display:none}.step{padding:11px;border-left:3px solid #a8b7b0;margin:8px 0;background:#f5f8f6}.step.done{border-color:#0a855e}.step.wait{border-color:#dcaa3e}.bad{color:#b22828}.ok{color:#176d4c}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#12342c;color:#d6f5e7;padding:13px;border-radius:8px;max-height:300px;overflow:auto}#details{white-space:pre-wrap}small{color:#587367}
</style></head><body><main><h1>♡ 暖心同行｜四站雲端接力診斷</h1><p class="muted">小安 V0001 → 幹部 A0001 → 小恩 V0002 → 幹部 A0001。只使用測試訊息，不接觸正式清點單。每一步成功才可進入下一步。</p>
<div class="card" id="login"><h2>登入測試帳號</h2><label for="code">代號</label><select id="code" style="width:100%;padding:12px"><option value="V0001">小安 V0001</option><option value="A0001">幹部 A0001</option><option value="V0002">小恩 V0002</option></select><label for="pin">PIN（Firebase 登入密碼）</label><input id="pin" type="password" autocomplete="current-password"><button id="loginBtn">登入</button><p id="loginStatus" class="muted">未登入</p></div>
<div class="card hide" id="work"><h2 id="who"></h2><p id="connection" class="muted"></p><div id="stages"></div><div id="controls"></div><p id="actionStatus" class="muted"></p><button id="logoutBtn" class="light">登出</button></div>
<div class="card"><h2>診斷記錄</h2><p class="muted">記錄所用的 Firebase 路徑及成功／失敗階段。複製後傳給我判斷；不包含密碼。</p><pre id="log">尚未開始</pre><button id="copy" class="light">複製記錄</button></div>
<p class="muted">建議幹部用 Chrome、小安用 Edge、小恩用手機 Safari。不同瀏覽器分開登入；不要把志工 UID 設為 admin。</p></main>
<script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), E={A0001:'a0001@gmail.com.tw',V0001:'v0001@gmail.com',V0002:'v0002@gmail.com'},U={V0001:'foudZi2657aMzg0XRPmDcidP6sp1',V0002:'doMqfg6D70Ph5a49EuDPn7ELcS52'},PATH='cloudDiagnostics/relay/'+U.V0001;
let auth,db,user=null,role=null,last=null,listener=null;const history=[];
function writeLog(step,status,detail=''){history.push(new Date().toLocaleString('zh-TW')+'｜'+step+'｜'+status+(detail?'｜'+detail:''));$('log').textContent=history.join('\n');}
function error(e){return String(e?.code||e?.message||e)}
function cleanListener(){if(listener&&db)db.ref(PATH).off('value',listener);listener=null;}
function makeButton(label,fn,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;return b}
function showStatus(s,fail=false){$('actionStatus').textContent=s;$('actionStatus').className=fail?'bad':'muted'}
function stage(n,text,done,active){const d=document.createElement('div');d.className='step '+(done?'done':active?'wait':'');d.textContent=n+'　'+(done?'✓ ':'')+text;return d}
function render(data){last=data||{};const m=last.meta,f=last.forward,r=last.reply,a=last.ack;const s=$('stages');s.replaceChildren(stage('①','小安送出到雲端',!!m,!m),stage('②','幹部收到並轉交小恩',!!f,!!m&&!f),stage('③','小恩收到並回覆',!!r,!!f&&!r),stage('④','幹部收到小恩回覆並完成確認',!!a,!!r&&!a));const c=$('controls');c.replaceChildren();
if(role==='V0001'){if(!m)c.append(makeButton('① 小安傳送 TEST-001',()=>act('小安寫入',PATH+'/meta',()=>db.ref(PATH+'/meta').set({runId:'TEST-'+Date.now(),fromUid:user.uid,text:'TEST-001 小安清點接力測試',at:firebase.database.ServerValue.TIMESTAMP}))));else{const p=document.createElement('p');p.textContent='已送出：'+m.runId+'。請幹部使用 A0001 登入確認，再轉交小恩。';c.append(p)}}
if(role==='A0001'){if(!m){const p=document.createElement('p');p.textContent='等待小安送出 TEST-001';c.append(p)}else if(!f)c.append(makeButton('② 幹部收到，轉交小恩',()=>act('幹部轉交',PATH+'/forward',()=>db.ref(PATH+'/forward').set({runId:m.runId,targetUid:U.V0002,fromUid:user.uid,at:firebase.database.ServerValue.TIMESTAMP}))));else if(!r){const p=document.createElement('p');p.textContent='已轉交小恩，等待 V0002 回覆。';c.append(p)}else if(!a)c.append(makeButton('④ 幹部確認已收到小恩回覆',()=>act('幹部確認回覆',PATH+'/ack',()=>db.ref(PATH+'/ack').set({runId:m.runId,byUid:user.uid,at:firebase.database.ServerValue.TIMESTAMP}))));else{const p=document.createElement('p');p.className='ok';p.textContent='四站接力全部成功：'+m.runId;c.append(p)}
c.append(makeButton('重設測試資料（僅本診斷）',()=>{if(!confirm('只刪除這筆雲端接力測試，不影響正式清點單。確定？'))return;act('幹部重設',PATH,()=>db.ref(PATH).remove())}))}
if(role==='V0002'){if(!f){const p=document.createElement('p');p.textContent='等待幹部轉交測試訊息';c.append(p)}else if(!r)c.append(makeButton('③ 小恩收到，回覆幹部',()=>act('小恩回覆',PATH+'/reply',()=>db.ref(PATH+'/reply').set({runId:f.runId,fromUid:user.uid,text:'小恩已收到 '+f.runId,at:firebase.database.ServerValue.TIMESTAMP}))));else{const p=document.createElement('p');p.className='ok';p.textContent='回覆已傳送，等待幹部確認。';c.append(p)}}
}
async function act(label,path,fn){showStatus('處理中：'+label);try{await fn();writeLog(label,'成功',path);showStatus(label+' 已成功寫入 Firebase')}catch(e){writeLog(label,'失敗',path+' | '+error(e));showStatus(label+' 失敗：'+error(e),true)}}
function start(u,selected){user=u;role=selected;$('work').classList.remove('hide');$('login').classList.add('hide');$('who').textContent={V0001:'小安',V0002:'小恩',A0001:'幹部'}[role]+'｜'+role;$('connection').textContent='登入 UID：'+u.uid+'；正在讀取 '+PATH;writeLog('登入','成功',role+' '+u.uid);db.ref(PATH).on('value',listener=s=>{writeLog('讀取接力','成功',PATH);$('connection').textContent='接力資料讀取正常';render(s.val())},e=>{writeLog('讀取接力','失敗',PATH+' | '+error(e));showStatus('讀取失敗：'+error(e),true)})}
$('loginBtn').onclick=async()=>{const selected=$('code').value,pin=$('pin').value; if(!pin){$('loginStatus').textContent='請輸入 PIN';return}$('loginBtn').disabled=true;$('loginStatus').textContent='驗證中…';try{if(!auth)throw Error('Firebase 尚未初始化');if(auth.currentUser&&auth.currentUser.email?.toLowerCase()!==E[selected])await auth.signOut();const u=(await auth.signInWithEmailAndPassword(E[selected],pin)).user;if(u.email.toLowerCase()!==E[selected])throw Error('登入帳號不符');if(selected==='V0001'&&u.uid!==U.V0001||selected==='V0002'&&u.uid!==U.V0002)throw Error('志工 UID 與測試設定不一致');if(selected==='A0001'){const s=await db.ref('roles/'+u.uid).once('value');if(s.val()!=='admin')throw Error('A0001 尚未具備 admin 角色')} $('pin').value='';start(u,selected);}catch(e){writeLog('登入','失敗',error(e));$('loginStatus').textContent='登入失敗：'+error(e)}finally{$('loginBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{cleanListener();await auth.signOut();user=null;role=null;$('work').classList.add('hide');$('login').classList.remove('hide');$('loginStatus').textContent='已登出'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);alert('已複製')}catch(e){prompt('請複製內容',$('log').textContent)}};
try{if(!window.VOLUNTEER_FIREBASE_CONFIG?.databaseURL)throw Error('找不到 firebase-config.js');firebase.initializeApp(window.VOLUNTEER_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();writeLog('Firebase 初始化','成功',window.VOLUNTEER_FIREBASE_CONFIG.projectId)}catch(e){$('loginStatus').textContent=error(e);writeLog('Firebase 初始化','失敗',error(e))}
})();
</script></body></html>
