<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜V2.6 清點欄位診斷</title><style>body{margin:0;background:#f0f6f3;color:#193f38;font:16px system-ui,'Microsoft JhengHei',sans-serif}main{max-width:980px;margin:26px auto;padding:0 16px}.card{background:white;border:1px solid #d8e6e0;border-radius:15px;padding:20px;margin:14px 0}h1{font-size:25px}h2{font-size:19px}p{color:#56736b;line-height:1.6}button,select,input{font:inherit;border-radius:9px;border:1px solid #a3c5ba;padding:11px}button{cursor:pointer;background:#176e5e;color:white}button.secondary{background:white;color:#135e50}button:disabled{opacity:.45;cursor:default}select{width:100%;max-width:750px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:530px}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce9e5}td input{width:140px;max-width:100%}.status{padding:12px;border-radius:9px;background:#eaf5ef}.bad{background:#ffede8;color:#a02e1d}.good{color:#0b7259}pre{background:#102f29;color:#d0f7e6;padding:14px;border-radius:9px;white-space:pre-wrap;overflow:auto;max-height:370px;font:12px/1.7 Consolas,monospace}.small{font-size:13px;color:#628079}</style></head><body><main><h1>♡ 暖心同行｜V2.6 清點欄位診斷</h1><p>只檢查「畫面欄位 → 驗證 → 雲端草稿比對」，<strong>不寫入 Firebase、不送審、不修改正式清點單</strong>。使用同一瀏覽器中已登入的 V0002。</p>
<section class="card"><h2>① 身分及任務</h2><div class="row"><span id="identity" class="status">偵測中…</span><button id="refresh" class="secondary">重新載入任務</button></div><p><select id="task" disabled><option>正在讀取…</option></select></p><button id="load" disabled>讀取任務與雲端草稿</button><p id="taskInfo" class="small"></p></section>
<section class="card"><h2>② 模擬小恩輸入（僅測試頁）</h2><p class="small">修改下面的欄位後按「檢查畫面輸入值」。這些輸入不會自動儲存；可從雲端草稿載入來對照。</p><div class="table"><table><thead><tr><th>倉別</th><th>品號</th><th>數量</th><th>效期 YYYYMM</th></tr></thead><tbody id="rows"><tr><td colspan="4">先讀取任務</td></tr></tbody></table></div><p class="row"><button id="check" disabled>檢查畫面輸入值</button><button id="useCloud" class="secondary" disabled>用雲端草稿填入測試欄位</button><button id="useRef" class="secondary" disabled>清空並重新測試</button></p><div id="verdict" class="status">尚未檢查</div></section>
<section class="card"><h2>③ 診斷紀錄</h2><div class="row"><button id="copy" class="secondary">複製紀錄</button><button id="clear" class="secondary">清除畫面紀錄</button></div><pre id="log">尚未開始</pre></section>
</main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s);let auth,db,user,assigned={},taskId='',draft=null,reference=[];const uidNames={'foudZi2657aMzg0XRPmDcidP6sp1':'V0001 小安','doMqfg6D70Ph5a49EuDPn7ELcS52':'V0002 小恩','HwYhtNeoUiURYK8qNPRG4AkdbXR2':'A0001 幹部'};function log(action,path,message){const el=$('#log'),line=new Date().toLocaleString('zh-TW',{hour12:false})+' | '+action+' | '+path+' | '+message;el.textContent=(el.textContent==='尚未開始'?'':el.textContent+'\n')+line;el.scrollTop=el.scrollHeight}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const err=e=>(e?.code||'ERROR')+' '+(e?.message||String(e));async function read(path){try{const v=(await db.ref(path).once('value')).val();log('讀取成功',path,v===null?'null':`有資料 (${typeof v==='object'?Object.keys(v).length+' 欄位':'值='+v})`);return v}catch(e){log('讀取失敗',path,err(e));throw e}}
async function tasks(){if(!user)return;$('#task').disabled=true;$('#load').disabled=true;assigned=await read('v9/assigned/'+user.uid)||{};const sel=$('#task');sel.innerHTML='';const list=Object.entries(assigned).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));for(const [id,a] of list)sel.add(new Option(`${a.docNo||id}｜V${a.roundNo||'?'}｜${a.title||''}`,id));if(!list.length){sel.add(new Option('沒有任務',''));return}sel.value=list.find(([,a])=>a.docNo==='INV-20261022-5AQ5L')?.[0]||list[0][0];sel.disabled=false;$('#load').disabled=false;log('任務數量','v9/assigned/'+user.uid,String(list.length))}
function fill(items){$('#rows').innerHTML=items.map((r,i)=>`<tr data-i="${i}"><td>${esc(r.warehouse)}</td><td>${esc(r.sku)}</td><td><input data-k="quantity" type="number" min="0" step="1" placeholder="數量" value="${esc(r.quantity)}"></td><td><input data-k="expiry" inputmode="numeric" maxlength="6" placeholder="YYYYMM" value="${esc(r.expiry)}"></td></tr>`).join('')||'<tr><td colspan="4">沒有可檢查項目</td></tr>';$('#check').disabled=!items.length}
function buildRows(source){return reference.map((r,i)=>({...r,quantity:source==='cloud'?(draft?.rows?.[i]?.quantity??''):'',expiry:source==='cloud'?(draft?.rows?.[i]?.expiry??''):''}))}
async function load(){taskId=$('#task').value;const a=assigned[taskId];if(!a)return;try{const submitted=await read('v9/submissions/'+taskId);draft=await read('v9/drafts/'+user.uid+'/'+taskId);reference=a.reference||[];$('#taskInfo').textContent=`單號：${a.docNo}，V${a.roundNo}；雲端草稿 rev=${draft?.rev??0}，rows=${draft?.rows?.length??0}；已提交：${!!submitted}`;log('讀取任務','v9/assigned/'+user.uid+'/'+taskId,`docNo=${a.docNo}, referenceRows=${reference.length}`);fill(buildRows('cloud'));$('#useCloud').disabled=!draft;$('#useRef').disabled=false;$('#verdict').className='status';$('#verdict').textContent='已載入雲端草稿到測試欄位；請按「檢查畫面輸入值」';}catch(e){$('#verdict').textContent='讀取失敗：'+err(e)}}
function check(){const raw=[...$('#rows').querySelectorAll('tr[data-i]')].map((tr,i)=>({warehouse:reference[i].warehouse,sku:reference[i].sku,quantity:tr.querySelector('[data-k="quantity"]').value,expiry:tr.querySelector('[data-k="expiry"]').value}));log('畫面讀值','測試欄位',JSON.stringify(raw));const bad=raw.flatMap((r,i)=>{const issues=[];if(String(r.quantity).trim()==='')issues.push('數量空白');else if(!/^\d+$/.test(String(r.quantity))||!Number.isSafeInteger(Number(r.quantity)))issues.push('數量非有效非負整數');if(String(r.expiry).trim()==='')issues.push('效期空白');else if(!/^\d{6}$/.test(r.expiry)||Number(r.expiry.slice(4,6))<1||Number(r.expiry.slice(4,6))>12)issues.push('效期格式不正確');return issues.map(x=>`第${i+1}筆 ${x}`)});const obj=raw.map(r=>({...r,quantity:Number(r.quantity)}));log('送審必填檢查','quantity / expiry',bad.length?bad.join('；'):'全部通過');log('準備送審資料（模擬）','items',JSON.stringify(obj));if(draft){log('雲端草稿現值','v9/drafts/'+user.uid+'/'+taskId,JSON.stringify({rev:draft.rev,rows:draft.rows}));log('差異提醒','測試輸入 vs 草稿',JSON.stringify(raw.map((r,i)=>({row:i+1,quantitySame:String(r.quantity)===String(draft.rows?.[i]?.quantity??''),expirySame:r.expiry===String(draft.rows?.[i]?.expiry??'')}))))}const v=$('#verdict');v.className='status '+(bad.length?'bad':'good');v.textContent=bad.length?'未通過：'+bad.join('、'):'測試欄位驗證通過；正式頁仍報錯時，應檢查正式程式 gather() 與畫面 rows 狀態是否一致（本頁沒有真的送審）。'}
function init(){try{const cfg=window.VOLUNTEER_FIREBASE_CONFIG;if(!cfg?.apiKey||!cfg?.databaseURL)throw Error('未找到 firebase-config.js 設定');if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(async u=>{user=u||null;$('#identity').textContent=user?(uidNames[user.uid]||'登入成功'):'未登入，請在同一瀏覽器開啟志工端登入';log('目前登入','Firebase Authentication',user?(uidNames[user.uid]||user.uid):'未登入');if(user)try{await tasks()}catch(e){log('任務初始化失敗','v9/assigned',err(e))}})}catch(e){log('Firebase 初始化失敗','config',err(e))}}
$('#load').onclick=load;$('#check').onclick=check;$('#useCloud').onclick=()=>{fill(buildRows('cloud'));log('操作','測試欄位','重載雲端草稿值')};$('#useRef').onclick=()=>{fill(buildRows('empty'));log('操作','測試欄位','清空數量與效期，重新測試')};$('#refresh').onclick=()=>tasks().catch(e=>log('重新讀取失敗','assigned',err(e)));$('#task').onchange=()=>{$('#load').disabled=false;$('#check').disabled=true;$('#verdict').textContent='已切換任務，請重新讀取';};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#log').textContent)}catch(e){const t=document.createElement('textarea');t.value=$('#log').textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}};$('#clear').onclick=()=>$('#log').textContent='尚未開始';init()})();
</script></body></html>
