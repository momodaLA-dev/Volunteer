<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c7669"><title>暖心同行｜幹部後台</title><link rel="icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./cloud-hub.css?v=800"></head><body><div id="signin"><div class="login"><div class="logo">♡</div><h1>暖心同行</h1><p style="text-align:center;color:#73877f">幹部後台 · 代號與 PIN 登入</p><form id="loginForm"><label>使用者代號<input id="code" autocomplete="username" placeholder="A0001" required></label><label>個人 PIN<input id="pin" type="password" autocomplete="current-password" minlength="6" required></label><button>登入暖心同行</button><p id="signinError" role="status"></p></form></div></div><div id="shell" hidden><div class="wrap"><header class="head"><div class="brand">♡ 暖心同行<small>幹部後台 · Firebase 雲端同步</small></div><div class="identity"><span id="identity"></span><button class="secondary" id="logout">登出</button></div></header><nav id="nav" class="nav"></nav><p id="state" class="status" aria-live="polite">已連接雲端</p><main id="mainPanel"></main><p class="muted">正式資料以 Firebase 為準。舊版僅存在原瀏覽器的示範紀錄不會自動出現在這裡。</p></div></div><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="./cloud-hub.js?v=800" defer></script></body></html>
