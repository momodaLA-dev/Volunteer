<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜草稿同步診斷 V2.4</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#163b36;background:#f2f7f5}*{box-sizing:border-box}main{max-width:850px;margin:24px auto;padding:20px}.card{background:white;border:1px solid #d8e6e0;border-radius:16px;padding:22px;margin-bottom:14px}h1{font-size:25px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.65;color:#526c66}button,select{font:inherit;padding:11px 15px;border:1px solid #a8c6bd;border-radius:10px;background:white;color:#123e36}button{cursor:pointer}button.primary{background:#136b5c;color:white;border-color:#136b5c}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e8f4ee;font-size:13px}.log{white-space:pre-wrap;word-break:break-word;background:#112f29;color:#d6f6e6;padding:16px;border-radius:10px;max-height:430px;overflow:auto;line-height:1.6;font-family:Consolas,monospace;font-size:12px}.warn{color:#a24529}.ok{color:#166650}label{display:block;margin-bottom:8px;font-weight:600}select{width:100%;margin-bottom:12px}.muted{font-size:13px}.status{font-weight:700}</style></head><body><main><h1>♡ 暖心同行｜V2.4 草稿同步診斷</h1><p>只測試正式清點使用的 <code>v9/assigned</code> 與 <code>v9/drafts</code>。不新增主單、不送審、不更動數量或效期。使用現有 Firebase 登入狀態。</p>
<section class="card"><h2>① 目前身分</h2><div class="row"><span id="identity" class="pill">讀取中…</span><button id="refresh" type="button">重新偵測登入</button><a href="./inventory-volunteer.html">前往志工清點登入</a></div><p class="muted">如果顯示未登入，請先在同一瀏覽器登入志工清點頁，再回來重新整理。不要把 PIN 貼給任何人。</p></section>
<section class="card"><h2>② 選擇要診斷的任務</h2><label for="task">我的雲端指派任務</label><select id="task" disabled><option>請先讀取任務</option></select><div class="row"><button id="load" class="primary" disabled>讀取任務及草稿</button><button id="tx" disabled>測試交易（保留原值）</button></div><p id="summary" class="muted">尚未讀取</p><p class="warn muted">「測試交易」會對選定草稿送出一次內容不變的交易；若尚無草稿，只做模擬，不建立任何資料。建議先使用測試單。</p></section>
<section class="card"><h2>③ 診斷紀錄</h2><div class="row"><button id="copy">複製紀錄</button><button id="clear">清空畫面紀錄</button></div><pre id="log" class="log">尚未開始</pre></section>
</main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const el=$('#log');let db,auth,user,assigned={},draft=null,roundId=null;
const uidNames={foudZi2657aMzg0XRPmDcidP6sp1:'V0001 小安',doMqfg6D70Ph5a49EuDPn7ELcS52:'V0002 小恩',HwYhtNeoUiURYK8qNPRG4AkdbXR2:'A0001 幹部'};
const log=(stage,path,message)=>{const line=new Date().toLocaleString('zh-TW',{hour12:false})+' | '+stage+' | '+path+' | '+message;el.textContent=(el.textContent==='尚未開始'?'':el.textContent+'\n')+line;el.scrollTop=el.scrollHeight;};
const pretty=e=>(e?.code||'ERROR')+' '+(e?.message||String(e));
const clone=x=>JSON.parse(JSON.stringify(x));
async function get(path){try{const s=await db.ref(path).once('value');let v=s.val();log('讀取成功',path,v===null?'null':`有資料 (${typeof v==='object'?Object.keys(v).length+' 個欄位':'值='+String(v)})`);return v;}catch(e){log('讀取失敗',path,pretty(e));throw e;}}
function ready(ok){$('#load').disabled=!ok;$('#tx').disabled=true;$('#task').disabled=!ok;}
async function find(){ready(false);if(!user)return;const path=`v9/assigned/${user.uid}`;try{assigned=await get(path)||{};const entries=Object.entries(assigned);const select=$('#task');select.innerHTML='';if(!entries.length){select.add(new Option('沒有指派任務',''));$('#summary').textContent='找不到此帳號的指派任務';return;}entries.sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));for(const [id,d] of entries){const label=`${d.docNo||id} | V${d.roundNo||'?'} | ${d.title||''}`;select.add(new Option(label,id));}select.value=entries.find(([id,d])=>String(d.docNo||'').startsWith('INV-'))?.[0]||entries[0][0];ready(true);log('任務清單',path,`${entries.length} 筆`);}catch(e){$('#summary').textContent='任務讀取失敗，請複製診斷紀錄';}}
async function load(){roundId=$('#task').value;$('#tx').disabled=true;if(!roundId)return;const path=`v9/drafts/${user.uid}/${roundId}`;try{const a=assigned[roundId];log('確認任務',`v9/assigned/${user.uid}/${roundId}`,`docNo=${a.docNo||''}, V${a.roundNo||''}`);const submission=await get(`v9/submissions/${roundId}`);if(submission){$('#summary').textContent='此任務已送審；為保護原始結果，不測試草稿寫入。';return;}draft=await get(path);const version=draft?.rev??0;$('#summary').textContent=`任務：${a.docNo||roundId}；雲端草稿：${draft?'存在':'不存在'}；rev=${version}；${draft?.rows?.length||0} 筆資料。`;log('版本檢查',path,`rev=${version}, rows=${draft?.rows?.length||0}, updatedAt=${draft?.updatedAt||'無'}`);$('#tx').disabled=false;}catch(e){$('#summary').textContent='讀取失敗；請複製下方紀錄。';}}
async function transact(){if(!user||!roundId)return;const path=`v9/drafts/${user.uid}/${roundId}`;$('#tx').disabled=true;try{const s=await db.ref(path).once('value');const baseline=s.val();if(baseline===null){log('不寫入',path,'目前沒有草稿，避免建立診斷用草稿；請先用正式清點頁建立草稿再測');return;}const expected=baseline.rev??0;let calls=0,firstNull=0;log('交易開始',path,`原始 rev=${expected}，採用相同原值交易，不改內容`);
const result=await db.ref(path).transaction(cur=>{calls++;if(cur===null){firstNull++;return;}if((cur.rev??0)!==expected)return;return clone(cur);},undefined,false);
log(result.committed?'交易成功':'交易未提交',path,`callback=${calls} 次，其中 null=${firstNull} 次，committed=${result.committed}`);
const check=await get(path);const actual=check?.rev??0;log('交易後核對',path,`rev=${actual}，${actual===expected?'原有版本保留':'版本變更，請檢查'}`);
if(firstNull>0)log('關鍵發現',path,'transaction 曾收到暫時 null；若正式版將它視為衝突，可能造成誤判。');
if(!result.committed)log('建議',path,'交易未提交；請保留紀錄供檢查，不要刪除草稿。');
}catch(e){log('交易失敗',path,pretty(e));}finally{$('#tx').disabled=false;}}
function init(){try{const cfg=window.VOLUNTEER_FIREBASE_CONFIG;if(!cfg?.apiKey||!cfg?.databaseURL)throw Error('無 firebase-config.js');if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(async u=>{user=u||null;$('#identity').textContent=u?`${uidNames[u.uid]||'已登入'} | ${u.uid}`:'未登入';log('身分確認','Firebase Auth',u?uidNames[u.uid]||u.uid:'未登入');if(u)await find();else ready(false)});}catch(e){log('初始化失敗','Firebase',pretty(e));}}
$('#load').onclick=load;$('#tx').onclick=transact;$('#refresh').onclick=async()=>{if(auth){await auth.currentUser?.reload().catch(e=>log('更新失敗','Auth',pretty(e)));user=auth.currentUser;$('#identity').textContent=user?(uidNames[user.uid]||user.uid):'未登入';await find();}};$('#task').onchange=()=>{$('#tx').disabled=true;$('#summary').textContent='已切換任務，請重新按讀取';};$('#copy').onclick=()=>{const text=el.textContent;navigator.clipboard?.writeText(text).then(()=>log('操作','複製','紀錄已複製')).catch(()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();});};$('#clear').onclick=()=>el.textContent='尚未開始';init();
})();</script></body></html>
