<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖心同行｜跨手機幹部測試</title><link rel="stylesheet" href="./sync.css"></head><body><header><h1>暖心同行｜雲端測試後台</h1><p>幹部專用 · 原 v6.2 後台不變</p></header><main><section class="panel" id="loginBox"><h2>幹部登入</h2><label>幹部代號</label><input id="volCode" type="text" autocomplete="username" autocapitalize="characters" placeholder="例如 A001" maxlength="16" spellcheck="false"><label>個人 PIN（至少 6 碼）</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" placeholder="至少 6 碼"><button id="login" style="margin-top:12px;width:100%">登入</button><p id="loginMessage" role="status" aria-live="polite" style="min-height:24px;margin-top:10px"></p><p class="muted">代號需先由 Firebase 專案管理員建立，並另外授予 admin 角色。</p></section><div id="app" class="hidden"><section class="panel"><div class="row"><div><strong>雲端同步管理</strong><p class="muted" id="connection"></p></div><button class="secondary" id="logout">登出</button></div><p id="message"></p></section><section class="panel"><h2>1. 建立派發任務</h2><form id="createForm"><label>任務名稱</label><input name="title" placeholder="例：王先生捐贈／第一輪清點" required maxlength="80"><label>受派志工 UID</label><input name="uid" placeholder="從 Firebase Authentication 複製 UID" required><label>作業類型</label><select name="type"><option value="initial">初點</option><option value="recount">複點</option></select><label>複點範圍</label><select name="scope"><option value="all">全單複點</option><option value="abnormal">異常品號複點</option><option value="specific">指定範圍複點</option></select><label>核對方式</label><select name="mode"><option value="blind">獨立輸入（不顯示答案）</option><option value="visible">顯示參考資料（確認／修改）</option></select><label>參考明細（每行：倉別,品號,數量,效期YYYYMM）</label><textarea name="lines" placeholder="A倉,#01,10,202712&#10;A倉,#02,20,202808" required></textarea><p class="muted">獨立複點也只向志工顯示倉別／品號，隱藏數量與效期。測試版由幹部輸入參考清冊。</p><button>建立並派發到志工手機</button></form></section><section class="panel"><h2>2. 任務／複點版本與審核</h2><div id="tasks"></div></section><section class="panel"><h2>3. 幹部內部紀錄（志工不可見）</h2><p class="muted">在每張任務卡內新增內部備註；不修改志工原始清點明細。</p></section></div></main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="./sync.js?v=20261020-loginfix2"></script><script>window.addEventListener("load",()=>{setTimeout(()=>{const button=document.getElementById("login");const out=document.getElementById("loginMessage");if(button && !button.onclick && out){out.textContent="登入程式未載入。請確認 sync.js 已上傳，並重新整理頁面。";out.style.color="#b42318";}},600);});</script></body></html>
